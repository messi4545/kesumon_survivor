<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ケスモンサバイバー</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0b140e; color: #fff;
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
  user-select: none; -webkit-user-select: none; touch-action: none; }
canvas { display: block; }

.screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  z-index: 10; background: radial-gradient(ellipse at center, rgba(10,30,18,.55), rgba(0,0,0,.85)); }
.hidden { display: none !important; }

.title-box { text-align: center; padding: 20px; max-width: 980px; width: 100%; }
.logo { font-size: clamp(42px, 9vw, 96px); font-weight: 900; letter-spacing: .04em; line-height: 1.05;
  background: linear-gradient(180deg, #fff6b0 0%, #ffcf3a 45%, #d77a12 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #3a1d00) drop-shadow(0 0 18px rgba(255,190,60,.55)); }
.logo span { display: inline-block; background: linear-gradient(180deg, #d8ffe9 0%, #42f59b 50%, #0c8f5a 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { letter-spacing: .6em; color: #9fe7c0; font-weight: 700; margin: 6px 0 18px; font-size: 14px; }

.evo-line { display: flex; align-items: flex-end; justify-content: center; gap: 4px; margin: 6px 0 22px; flex-wrap: nowrap; }
.evo-item { display: flex; flex-direction: column; align-items: center; width: 22%; max-width: 190px; }
.evo-item img { width: 100%; aspect-ratio: 1/1.1; object-fit: contain;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.7)); animation: bob 2.4s ease-in-out infinite; }
.evo-item:nth-child(3) img { animation-delay: .3s; } .evo-item:nth-child(5) img { animation-delay: .6s; } .evo-item:nth-child(7) img { animation-delay: .9s; }
.evo-item .nm { font-weight: 900; font-size: clamp(12px, 1.8vw, 18px); margin-top: 4px; color: #ffe27a; text-shadow: 0 2px 0 #000; }
.evo-item .lv { font-size: 12px; color: #9fe7c0; }
.evo-arrow { font-size: clamp(18px, 3vw, 34px); color: #ffcf3a; align-self: center; text-shadow: 0 0 10px #ffb300; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

.btn { font: inherit; font-weight: 900; font-size: 20px; padding: 12px 34px; border-radius: 12px; cursor: pointer;
  color: #1b1000; background: linear-gradient(180deg, #ffe680, #ffb21e); border: 3px solid #fff3c4;
  box-shadow: 0 5px 0 #8a4f00, 0 0 22px rgba(255,190,40,.5); transition: transform .08s; }
.btn:hover { transform: translateY(-2px) scale(1.03); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a4f00; }
.btn.big { font-size: 28px; padding: 14px 60px; }
.btn.ghost { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.4); box-shadow: none; }
.btns { display: flex; gap: 14px; justify-content: center; margin-top: 18px; }

.howto { margin-top: 22px; color: #cfe; font-size: 14px; line-height: 1.9; text-shadow: 0 1px 2px #000; }
.small { font-size: 12px; color: #9ab; margin-top: 8px; }

.panel { background: linear-gradient(180deg, rgba(20,48,32,.96), rgba(8,22,14,.96)); border: 2px solid #4fd99a;
  border-radius: 18px; padding: 22px 26px; box-shadow: 0 0 40px rgba(60,255,160,.25); text-align: center;
  max-width: 94vw; max-height: 94vh; overflow: auto; }
.panel h2 { font-size: 34px; font-weight: 900; margin-bottom: 14px; color: #ffe27a; text-shadow: 0 3px 0 #5a3000; }
.lvup-title { animation: pulse .8s ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

#cards { display: flex; flex-direction: column; gap: 10px; width: min(560px, 88vw); }
.card { display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px 16px; cursor: pointer;
  border-radius: 12px; border: 2px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06);
  color: #fff; font: inherit; transition: all .1s; }
.card:hover, .card.sel { border-color: #ffd34d; background: rgba(255,211,77,.14); transform: translateX(4px); }
.card .ic { font-size: 38px; width: 52px; text-align: center; flex-shrink: 0; }
.card .tx { flex: 1; }
.card .nm { font-weight: 900; font-size: 18px; }
.card .tag { font-size: 12px; font-weight: 900; padding: 2px 8px; border-radius: 6px; margin-left: 8px; background: #2a6; }
.card .tag.new { background: #e5395b; }
.card .tag.pas { background: #3577d6; }
.card .ds { font-size: 13px; color: #cde; margin-top: 3px; }
.card .key { font-size: 12px; color: #9ab; }

#pauseInfo, #resultInfo { font-size: 16px; line-height: 1.8; }
.result-img { height: 160px; filter: drop-shadow(0 6px 12px rgba(0,0,0,.8)); margin-bottom: 6px; }

/* 取得装備スロット（HUDスタイル） */
.inv-box { margin: 12px auto 6px; padding: 10px 14px; background: rgba(0,0,0,.45); border: 1.5px solid rgba(255,255,255,.12); border-radius: 12px; display: inline-flex; flex-direction: column; gap: 8px; max-width: 90%; }
.inv-box .inv-title { font-size: 12px; font-weight: 900; color: #ffd86a; letter-spacing: 1px; }
.inv-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.inv-slot { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 44px; height: 44px;
  background: rgba(10,22,16,.85); border: 1.5px solid rgba(255,215,90,.7); border-radius: 8px; box-shadow: 0 3px 6px rgba(0,0,0,.5); position: relative; transition: transform .1s; }
.inv-slot:hover { transform: translateY(-2px) scale(1.06); }
.inv-slot .icon { font-size: 20px; line-height: 1; }
.inv-slot .lv { font-size: 9.5px; font-weight: 900; color: #ffe27a; margin-top: 2px; }
.inv-slot.max { border-color: #ff9d3b; box-shadow: 0 0 8px rgba(255,160,50,.5); }
.inv-slot.max .lv { color: #ff5566; }
.inv-slot.passive { width: 38px; height: 38px; border-color: rgba(100,190,255,.65); }
.inv-slot.passive .icon { font-size: 16px; }
.inv-slot.passive .lv { color: #9fd0ff; font-size: 9px; }
.inv-slot.passive.max { border-color: #6ee2ff; box-shadow: 0 0 6px rgba(110,226,255,.45); }

.mute { position: fixed; right: 10px; bottom: 10px; z-index: 20; width: 42px; height: 42px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.3); background: rgba(0,0,0,.45); color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.pause-btn { right: 58px; font-size: 17px; }

</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- タイトル -->
<div id="title" class="screen">
  <div class="title-box">
    <h1 class="logo">ケスモン<span>サバイバー</span></h1>
    <p class="sub">KESMON SURVIVOR</p>
    <div class="evo-line" id="evoLine"></div>
    <button id="startBtn" class="btn big">▶ スタート</button>
    <div class="howto">
      <p><b>移動</b>：WASD / 矢印キー（スマホは画面をドラッグ）　<b>攻撃</b>：自動</p>
      <p>敵を倒して経験値を集め、レベルアップで<b>進化</b>せよ！</p>
      <p>10分生き延びて現れる<b>最終ボス</b>を倒せばクリア</p>
      <p class="small">Space / Esc / P：ポーズ　M：サウンド ON/OFF</p>
    </div>
  </div>
</div>

<!-- レベルアップ -->
<div id="levelup" class="screen hidden">
  <div class="panel">
    <h2 class="lvup-title">LEVEL UP!</h2>
    <div id="cards"></div>
    <p class="small">クリック または 1〜4キーで選択</p>
  </div>
</div>

<!-- ポーズ -->
<div id="pause" class="screen hidden">
  <div class="panel">
    <h2>PAUSE</h2>
    <div id="pauseInfo"></div>
    <div class="btns">
      <button id="resumeBtn" class="btn">再開</button>
      <button id="quitBtn" class="btn ghost">タイトルへ</button>
    </div>
  </div>
</div>

<!-- リザルト -->
<div id="result" class="screen hidden">
  <div class="panel">
    <h2 id="resultTitle">GAME OVER</h2>
    <img id="resultImg" class="result-img" alt="">
    <div id="resultInfo"></div>
    <div class="btns">
      <button id="retryBtn" class="btn">もう一度</button>
      <button id="toTitleBtn" class="btn ghost">タイトルへ</button>
    </div>
  </div>
</div>

<button id="pauseBtn" class="mute pause-btn" title="ポーズ (Space / Esc)">⏸</button>
<button id="muteBtn" class="mute" title="サウンド (M)">🔊</button>

'use strict';
/* =========================================================
   ケスモンサバイバー  -  KESMON SURVIVOR
   ヴァンパイアサバイバー系 自動攻撃サバイバルゲーム

(() => {
const $ = id => document.getElementById(id);
const canvas = $('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

/* ---------------- 進化フォーム（添付画像の順） ---------------- */

  { name: 'ケスモン',         title: '幼体',   lv: 1,  size: 74,  weapon: 'fireball', color: '#ffb347' },
  { name: 'ドラグケスモン',   title: '成長体', lv: 8,  size: 88,  weapon: 'tail',     color: '#9cff57' },
  { name: 'オーバードケスモン', title: '改造体', lv: 18, size: 96,  weapon: 'saw',      color: '#5fd6ff' },
  { name: 'ホスピスケスモン', title: '究極体', lv: 30, size: 110, weapon: 'aura',     color: '#7dffc4' },
];
const FORM_IMG = [], FORM_WHITE = [];

function circleCrop(img) {
  const s = Math.min(img.width, img.height);
  const c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.beginPath(); g.arc(s / 2, s / 2, s / 2, 0, TAU); g.clip();
  g.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, s, s);
  return c;
}
function whiteSilhouette(img) {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  return c;
}
function loadForm(i) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res(trimImage(im));
    im.onerror = () => {
      const j = new Image();
      j.onload = () => res(circleCrop(j));
      j.onerror = () => res(null);
      j.src = `img/raw${i + 1}.jpg`;

    im.src = EMBEDDED_IMGS[i];
  });

// 透明な余白を自動トリム（file:// で読み込み制限がある場合はそのまま使う）
function trimImage(img) {
  try {
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height).data;
    let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
      if (d[(y * c.width + x) * 4 + 3] > 16) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 < 0) return img;
    const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
    o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
    return o;
  } catch (e) { return img; }
}
// ステージ背景画像（img/bg.png または img/bg.jpg があれば使用）
let BG_IMG = null;
function loadBg() {
  return new Promise(res => {
    const a = new Image();
    a.onload = () => { BG_IMG = a; res(); };
    a.onerror = () => { const b = new Image(); b.onload = () => { BG_IMG = b; res(); }; b.onerror = () => res(); b.src = 'img/bg.jpg'; };
    a.src = 'img/bg.png';
  });
}

const AC = { ctx: null, master: null, muted: false };
function audioInit() {
  if (AC.ctx) { if (AC.ctx.state === 'suspended') AC.ctx.resume(); return; }
  try {
    AC.ctx = new (window.AudioContext || window.webkitAudioContext)();
    AC.master = AC.ctx.createGain(); AC.master.gain.value = 0.3;
    AC.master.connect(AC.ctx.destination);
  } catch (e) { /* no audio */ }
}
function tone(freq, dur, type = 'square', vol = 0.2, slide = 0, delay = 0) {
  if (!AC.ctx || AC.muted) return;
  const t = AC.ctx.currentTime + Math.max(0, delay);
  const o = AC.ctx.createOscillator(), g = AC.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.master); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol = 0.2, delay = 0) {
  if (!AC.ctx || AC.muted) return;
  const t = AC.ctx.currentTime + delay;
  const len = Math.floor(AC.ctx.sampleRate * dur);
  const buf = AC.ctx.createBuffer(1, len, AC.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.ctx.createBufferSource(); s.buffer = buf;
  const g = AC.ctx.createGain(); g.gain.value = vol;
  s.connect(g); g.connect(AC.master); s.start(t);
}
const sfxLast = {};
function sfx(name) {
  const now = performance.now();
  const gap = { hit: 45, gem: 35, shoot: 60, zap: 80 }[name] || 30;
  if (sfxLast[name] && now - sfxLast[name] < gap) return;
  sfxLast[name] = now;
  switch (name) {
    case 'shoot': tone(520, 0.08, 'square', 0.05, -300); break;
    case 'hit': tone(180, 0.06, 'square', 0.05, -80); break;
    case 'gem': tone(1200 + Math.random() * 300, 0.06, 'sine', 0.07, 400); break;
    case 'hurt': tone(140, 0.2, 'sawtooth', 0.15, -90); break;
    case 'zap': noise(0.18, 0.12); tone(900, 0.15, 'sawtooth', 0.06, -700); break;
    case 'beam': tone(300, 0.3, 'sawtooth', 0.08, 900); break;
    case 'kill': tone(320, 0.07, 'triangle', 0.06, -200); break;
    case 'boom': noise(0.5, 0.3); tone(90, 0.5, 'sine', 0.3, -50); break;
    case 'poop': tone(240, 0.14, 'triangle', 0.14, -150); tone(130, 0.1, 'sine', 0.12, 60, 0.08); break;
    case 'poopBoom': noise(0.38, 0.26); tone(110, 0.38, 'sawtooth', 0.22, -70); tone(220, 0.2, 'square', 0.12, -140, 0.05); break;
    case 'heal': [660, 880, 1100].forEach((f, i) => tone(f, 0.12, 'sine', 0.12, 0, i * 0.07)); break;
    case 'levelup': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'square', 0.09, 0, i * 0.07)); break;
    case 'select': tone(880, 0.08, 'square', 0.08); break;
    case 'warning': for (let i = 0; i < 3; i++) tone(440, 0.25, 'sawtooth', 0.12, -100, i * 0.35); break;
    case 'evoFlash': tone(600 + Math.random() * 600, 0.05, 'sine', 0.06); break;
    case 'evolve': {
      const m = [523, 659, 784, 1047, 784, 1047, 1319, 1568];
      m.forEach((f, i) => tone(f, 0.22, 'square', 0.1, 0, i * 0.11));
      tone(130, 1.2, 'triangle', 0.25, 0, 0); break;
    }
    case 'over': [392, 330, 262, 196].forEach((f, i) => tone(f, 0.35, 'triangle', 0.18, 0, i * 0.25)); break;
    case 'clear': [523, 659, 784, 1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 0.3, 'square', 0.1, 0, i * 0.12)); break;
  }
}
// BGM（動的テンポ＆ボス戦緊迫ビート対応チップチューン）
const BGM = { timer: null, step: 0, next: 0 };
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const PROG = [[45, 52, 57, 60], [41, 48, 53, 57], [43, 50, 55, 59], [40, 47, 52, 56]];
function bgmStart() {
  if (!AC.ctx || BGM.timer) return;
  BGM.next = AC.ctx.currentTime + 0.1; BGM.step = 0;
  BGM.timer = setInterval(() => {
    if (!AC.ctx) return;
    const playing = S && (S.state === 'play');
    const hasBoss = !!(S && S.enemies && S.enemies.some(e => e.boss && !e.dead));
    const pinch = !!(P && P.hp / P.maxHp < 0.35);
    const intense = hasBoss || pinch;
    const stepDur = intense ? 0.108 : 0.13;
    while (BGM.next < AC.ctx.currentTime + 0.25) {
      const s = BGM.step, d = BGM.next - AC.ctx.currentTime;
      if (playing && !AC.muted) {
        const ch = PROG[Math.floor(s / 16) % 4];
        if (s % 2 === 0) tone(midi(ch[0] - 12), intense ? 0.15 : 0.2, 'triangle', intense ? 0.2 : 0.16, 0, d);
        else if (intense) tone(midi(ch[0]), 0.08, 'sawtooth', 0.08, 0, d); // ボス戦ベースオクターブ刻み
        tone(midi(ch[s % 4] + 12), 0.09, 'square', intense ? 0.035 : 0.025, 0, d);
        if (s % 4 === 0 || (intense && s % 2 === 0)) noise(0.04, intense ? 0.06 : 0.05, d);
        if (s % 8 === 4) noise(0.1, intense ? 0.09 : 0.07, d);
      }
      BGM.step++; BGM.next += stepDur;
    }
  }, 50);
}

/* ---------------- 入力 ---------------- */
const keys = {};
const joy = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyM') toggleMute();
  // タイトルまたはゲームオーバー時の Space / Enter スタート・リトライ
  if (e.code === 'Space' || e.code === 'Enter') {
    if (!S || S.state === 'over') { startGame(); e.preventDefault(); return; }
  }
  if ((e.code === 'Escape' || e.code === 'KeyP' || e.code === 'Space') && S) {
    if (S.state === 'play') pauseGame(); else if (S.state === 'pause') resumeGame();
  }
  if (S && S.state === 'levelup') {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= S.choices.length) chooseCard(n - 1);
  }
  if (S && S.state === 'evolve' && S.evo.t > 3.6 && (e.code === 'Space' || e.code === 'Enter')) finishEvolution();
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('pointerdown', e => {
  if (S && S.state === 'evolve' && S.evo.t > 3.6) { finishEvolution(); return; }
  if (e.pointerType === 'mouse') return;
  joy.active = true; joy.id = e.pointerId; joy.ox = joy.x = e.clientX; joy.oy = joy.y = e.clientY;
});

const ETYPES = {

  bat:    { name: 'コウモリ', hp: 11,    speed: 92, dmg: 5,  r: 12, xp: 1 },
  ghost:  { name: 'ゴースト', hp: 32,    speed: 68, dmg: 8,  r: 16, xp: 2 },
  gear:   { name: 'ギアボット', hp: 58,  speed: 48, dmg: 11, r: 18, xp: 3 },
  knight: { name: 'リザードナイト', hp: 100, speed: 64, dmg: 14, r: 19, xp: 5 },
  golem:  { name: '苔ゴーレム', hp: 230, speed: 38, dmg: 18, r: 30, xp: 9 },
  boss:   { name: 'スチームゴーレム', hp: 2800, speed: 62, dmg: 24, r: 54, xp: 80, boss: true },
  fboss:  { name: '機皇帝メカイザー', hp: 32000, speed: 58, dmg: 35, r: 72, xp: 0, boss: true },
};
const ESPR = {};
function makeEnemySprite(type) {
  const r = ETYPES[type].r;
  const s = Math.ceil(r * 3);
  const c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.translate(s / 2, s / 2);
  const eyes = (ex, ey, er, col = '#fff', pup = '#111') => {
    for (const sx of [-1, 1]) {
      g.fillStyle = col; g.beginPath(); g.arc(sx * ex, ey, er, 0, TAU); g.fill();
      g.fillStyle = pup; g.beginPath(); g.arc(sx * ex, ey + er * 0.2, er * 0.5, 0, TAU); g.fill();
    }
  };
  const glowEyes = (ex, ey, er, col) => {
    g.shadowColor = col; g.shadowBlur = er * 3; g.fillStyle = col;
    for (const sx of [-1, 1]) { g.beginPath(); g.arc(sx * ex, ey, er, 0, TAU); g.fill(); }
    g.shadowBlur = 0;
  };
  let grd;
  switch (type) {
    case 'slime':
      grd = g.createRadialGradient(-r * .3, -r * .4, 2, 0, 0, r * 1.3);
      grd.addColorStop(0, '#c8ff8a'); grd.addColorStop(1, '#2f9e3a');
      g.fillStyle = grd; g.beginPath();
      g.moveTo(-r * 1.1, r * .7); g.quadraticCurveTo(-r * 1.15, -r * 1.1, 0, -r * 1.1);
      g.quadraticCurveTo(r * 1.15, -r * 1.1, r * 1.1, r * .7); g.closePath(); g.fill();
      g.strokeStyle = '#1b5e20'; g.lineWidth = 2; g.stroke();
      g.fillStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.ellipse(-r * .4, -r * .55, r * .25, r * .15, -.5, 0, TAU); g.fill();
      eyes(r * .35, -r * .1, r * .22);
      break;
    case 'bat':
      g.lineJoin = 'round';
      g.strokeStyle = '#4dff79'; g.lineWidth = 3;
      g.fillStyle = '#5b2a86';
      for (const sx of [-1, 1]) {
        g.beginPath(); g.moveTo(sx * r * .3, -r * .2);
        g.lineTo(sx * r * 1.4, -r * .8); g.lineTo(sx * r * 1.2, 0); g.lineTo(sx * r * 1.4, r * .3);
        g.lineTo(sx * r * .9, r * .2); g.lineTo(sx * r * .3, r * .4); g.closePath();
        g.stroke(); g.fill();
      }
      g.fillStyle = '#3d1a5c';
      g.beginPath();
      g.moveTo(-r * .45, -r * .4); g.lineTo(-r * .3, -r * .95); g.lineTo(-r * .1, -r * .5);
      g.moveTo(r * .45, -r * .4); g.lineTo(r * .3, -r * .95); g.lineTo(r * .1, -r * .5);
      g.stroke(); g.fill();
      g.beginPath(); g.arc(0, 0, r * .6, 0, TAU); g.stroke(); g.fill();
      glowEyes(r * .22, -r * .1, r * .13, '#ff3355');
      break;
    case 'ghost':
      grd = g.createLinearGradient(0, -r, 0, r);
      grd.addColorStop(0, 'rgba(230,245,255,.95)'); grd.addColorStop(1, 'rgba(120,170,255,.6)');
      g.fillStyle = grd; g.beginPath();
      g.arc(0, -r * .2, r * .9, Math.PI, 0);
      g.lineTo(r * .9, r * .9);
      for (let i = 0; i < 4; i++) g.quadraticCurveTo(r * .9 - (i + .5) * r * .45, r * (i % 2 ? .9 : .5), r * .9 - (i + 1) * r * .45, r * .9);
      g.closePath(); g.fill();
      g.fillStyle = '#123'; g.beginPath(); g.ellipse(-r * .3, -r * .25, r * .14, r * .22, 0, 0, TAU); g.ellipse(r * .3, -r * .25, r * .14, r * .22, 0, 0, TAU); g.fill();
      g.beginPath(); g.ellipse(0, r * .2, r * .15, r * .2, 0, 0, TAU); g.fill();
      break;
    case 'gear': {
      g.fillStyle = '#7d858c';
      for (let i = 0; i < 8; i++) { g.save(); g.rotate(i * TAU / 8); g.fillRect(-r * .2, -r * 1.15, r * .4, r * .5); g.restore(); }
      grd = g.createRadialGradient(-r * .3, -r * .3, 2, 0, 0, r);
      grd.addColorStop(0, '#d5dbe0'); grd.addColorStop(1, '#59626b');
      g.fillStyle = grd; g.beginPath(); g.arc(0, 0, r * .85, 0, TAU); g.fill();
      g.strokeStyle = '#3b4249'; g.lineWidth = 2; g.stroke();
      g.fillStyle = '#222'; g.beginPath(); g.arc(0, 0, r * .42, 0, TAU); g.fill();
      g.shadowColor = '#ff2a2a'; g.shadowBlur = 10; g.fillStyle = '#ff3b3b';
      g.beginPath(); g.arc(0, 0, r * .25, 0, TAU); g.fill(); g.shadowBlur = 0;
      break;
    }
    case 'knight':
      g.fillStyle = '#3c6b2a'; g.beginPath(); g.ellipse(0, r * .35, r * .75, r * .65, 0, 0, TAU); g.fill();
      grd = g.createRadialGradient(-r * .2, -r * .5, 2, 0, -r * .2, r);
      grd.addColorStop(0, '#d7a24a'); grd.addColorStop(1, '#7a4a12');
      g.fillStyle = grd; g.beginPath(); g.arc(0, -r * .25, r * .7, 0, TAU); g.fill();
      g.fillStyle = '#e8e2d0';
      for (const sx of [-1, 1]) { g.beginPath(); g.moveTo(sx * r * .5, -r * .7); g.lineTo(sx * r * 1.05, -r * 1.25); g.lineTo(sx * r * .7, -r * .45); g.fill(); }
      g.fillStyle = '#222'; g.fillRect(-r * .5, -r * .35, r, r * .22);
      glowEyes(r * .25, -r * .24, r * .09, '#ffea00');
      g.fillStyle = '#aab'; g.fillRect(r * .75, -r * .6, r * .14, r * 1.5);
      break;
    case 'golem':
      grd = g.createRadialGradient(-r * .3, -r * .4, 4, 0, 0, r * 1.2);
      grd.addColorStop(0, '#9b8a73'); grd.addColorStop(1, '#4a3d2e');
      g.fillStyle = grd; g.beginPath();
      const pts = 10;
      for (let i = 0; i < pts; i++) { const a = i / pts * TAU, rr = r * (0.85 + ((i * 37) % 7) / 30); g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      g.closePath(); g.fill(); g.strokeStyle = '#2d241a'; g.lineWidth = 3; g.stroke();
      g.fillStyle = '#4caf50';
      for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(Math.cos(i * 1.7) * r * .6, -r * .5 + Math.sin(i * 2.3) * r * .25, r * .16, 0, TAU); g.fill(); }
      glowEyes(r * .3, -r * .05, r * .12, '#33e0ff');
      g.strokeStyle = '#2d241a'; g.lineWidth = 2; g.beginPath(); g.moveTo(-r * .3, r * .35); g.lineTo(r * .3, r * .35); g.stroke();
      break;
    case 'boss':
    case 'fboss': {
      const fin = type === 'fboss';
      g.fillStyle = fin ? '#2a0d3d' : '#3a1f12';
      for (let i = 0; i < 12; i++) { g.save(); g.rotate(i * TAU / 12); g.beginPath(); g.moveTo(-r * .15, -r * .8); g.lineTo(0, -r * 1.35); g.lineTo(r * .15, -r * .8); g.fill(); g.restore(); }
      grd = g.createRadialGradient(-r * .3, -r * .3, 5, 0, 0, r);
      if (fin) { grd.addColorStop(0, '#8a5cff'); grd.addColorStop(1, '#1a0630'); }
      else { grd.addColorStop(0, '#c0703a'); grd.addColorStop(1, '#3d1a08'); }
      g.fillStyle = grd; g.beginPath(); g.arc(0, 0, r * .95, 0, TAU); g.fill();
      g.strokeStyle = fin ? '#ffd54a' : '#d9a441'; g.lineWidth = 4; g.stroke();
      for (let i = 0; i < 8; i++) { const a = i * TAU / 8; g.fillStyle = fin ? '#ffd54a' : '#c9b38a'; g.beginPath(); g.arc(Math.cos(a) * r * .78, Math.sin(a) * r * .78, r * .06, 0, TAU); g.fill(); }
      if (fin) {
        g.fillStyle = '#ffd54a';
        for (const sx of [-1, 1]) { g.beginPath(); g.moveTo(sx * r * .35, -r * .7); g.quadraticCurveTo(sx * r * 1.1, -r * 1.2, sx * r * .9, -r * 1.6); g.quadraticCurveTo(sx * r * .7, -r * 1.0, sx * r * .15, -r * .75); g.fill(); }
      }
      g.fillStyle = '#111'; g.beginPath(); g.arc(0, -r * .05, r * .45, 0, TAU); g.fill();
      g.shadowColor = fin ? '#ff2bd6' : '#ff3b1f'; g.shadowBlur = 25;
      g.fillStyle = fin ? '#ff6ae6' : '#ff5a2a'; g.beginPath(); g.arc(0, -r * .05, r * .28, 0, TAU); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(-r * .08, -r * .13, r * .08, 0, TAU); g.fill();
      g.shadowBlur = 0;
      g.fillStyle = '#ddd';
      for (let i = -3; i <= 3; i++) { g.beginPath(); g.moveTo(i * r * .1 - r * .05, r * .5); g.lineTo(i * r * .1, r * .68); g.lineTo(i * r * .1 + r * .05, r * .5); g.fill(); }
      break;
    }
  }
  ESPR[type] = { img: c, white: whiteSilhouette(c), s };
}

const BG = (() => {
  const s = 512, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#1d3322'; g.fillRect(0, 0, s, s);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 60; i++) { // 苔のまだら
    const x = rnd() * s, y = rnd() * s, r = 20 + rnd() * 60;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, rnd() > .5 ? 'rgba(60,100,50,.35)' : 'rgba(20,40,25,.4)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 260; i++) { // 草
    const x = rnd() * s, y = rnd() * s;
    g.strokeStyle = `rgba(${80 + rnd() * 60},${140 + rnd() * 70},${60 + rnd() * 40},.55)`; g.lineWidth = 1.5;
    for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(x, y); g.lineTo(x + (k - 1) * 3 + rnd() * 2, y - 5 - rnd() * 6); g.stroke(); }
  }
  for (let i = 0; i < 10; i++) { // 石
    const x = rnd() * s, y = rnd() * s, r = 5 + rnd() * 10;
    g.fillStyle = 'rgba(90,100,90,.6)'; g.beginPath(); g.ellipse(x, y, r, r * .7, 0, 0, TAU); g.fill();
    g.fillStyle = 'rgba(80,140,60,.5)'; g.beginPath(); g.ellipse(x - 2, y - r * .3, r * .6, r * .3, 0, 0, TAU); g.fill();
  }
  for (let i = 0; i < 4; i++) { // 錆びた歯車
    const x = rnd() * s, y = rnd() * s, r = 10 + rnd() * 12;
    g.save(); g.translate(x, y); g.rotate(rnd() * 3); g.fillStyle = 'rgba(120,70,35,.55)';
    for (let k = 0; k < 8; k++) { g.save(); g.rotate(k * TAU / 8); g.fillRect(-r * .18, -r * 1.25, r * .36, r * .5); g.restore(); }
    g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
    g.fillStyle = '#1d3322'; g.beginPath(); g.arc(0, 0, r * .4, 0, TAU); g.fill(); g.restore();
  }
  for (let i = 0; i < 40; i++) { // 花・光る胞子
    const x = rnd() * s, y = rnd() * s;
    g.fillStyle = ['#ffd84a', '#ff7aa8', '#9ff', '#fff'][Math.floor(rnd() * 4)];
    g.globalAlpha = .7; g.beginPath(); g.arc(x, y, 1.5 + rnd() * 1.5, 0, TAU); g.fill(); g.globalAlpha = 1;
  }
  return { c, s, pat: ctx.createPattern(c, 'repeat') };
})();

let S = null;

function newGame() {
  S = {
    state: 'play', t: 0, kills: 0, level: 1, xp: 0, xpNext: xpFor(1), stage: 0,
    weapons: [], passives: { regen: 1 }, enemies: [], projs: [], ebullets: [], gems: [], pickups: [],

    spawnAcc: 0, clusterAng: 0, clusterT: 0, bossFlags: {}, pendingLevels: 0, shake: 0, banner: null, evo: null, choices: [],
    finalBoss: null, cam: { x: 0, y: 0 },
  };
  P = S.player = { x: 0, y: 0, hp: 100, maxHp: 100, r: 20, fx: 1, fy: 0, face: 1, hurt: 0, moving: false, anim: 0, speedBoost: 0, superAura: 0 };
  recalcStats();
  P.hp = P.maxHp;
  const fb = addWeapon('fireball');
  fb.lv = 2;
  addWeapon('syringe');
}
function pl(id) { return S.passives[id] || 0; }
function recalcStats() {
  const st = S.stage;
  const oldMax = P.maxHp;
  P.might = (1 + st * 0.15) * (1 + 0.12 * pl('might'));
  P.cd = 1 - 0.08 * pl('cd');
  P.speed = 155 + st * 8;
  P.maxHp = 100 + st * 30 + 25 * pl('hp');
  P.magnet = 100 * (1 + 0.35 * pl('magnet'));
  P.regen = 0.8 * pl('regen') + (st >= 3 ? 1.0 : 0);
  P.area = 1 + 0.12 * pl('area');
  P.armor = pl('armor') * 2;
  P.r = FORMS[st].size * 0.25;
  if (P.maxHp > oldMax) P.hp += P.maxHp - oldMax;
  P.hp = Math.min(P.hp, P.maxHp);
}
function hasWeapon(id) { return S.weapons.find(w => w.id === id); }
function addWeapon(id) {
  const w = hasWeapon(id);
  if (w) { w.lv = Math.min(WEAPONS[id].max, w.lv + 1); return w; }
  const nw = { id, lv: 1, t: 0.3, ang: 0, tick: 0 };
  S.weapons.push(nw); return nw;
}

const CELL = 64;
const grid = new Map();
const gridPool = [];
const gkey = (cx, cy) => (cx + 50000) * 100000 + (cy + 50000);
function buildGrid() {
  for (const a of grid.values()) { a.length = 0; gridPool.push(a); }
  grid.clear();
  const arr = S.enemies;
  for (let i = 0; i < arr.length; i++) {
    const e = arr[i]; if (e.dead) continue;
    const k = gkey(Math.floor(e.x / CELL), Math.floor(e.y / CELL));
    let a = grid.get(k);
    if (!a) { a = gridPool.pop() || []; grid.set(k, a); }
    a.push(e);
  }
}
function query(x, y, r, cb) {
  r += 75;
  const x0 = Math.floor((x - r) / CELL), x1 = Math.floor((x + r) / CELL);
  const y0 = Math.floor((y - r) / CELL), y1 = Math.floor((y + r) / CELL);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
    const a = grid.get(gkey(cx, cy));
    if (a) for (let i = 0; i < a.length; i++) if (!a[i].dead) cb(a[i]);
  }
}
function enemiesInCircle(x, y, r, cb) {
  query(x, y, r, e => { const dx = e.x - x, dy = e.y - y, rr = r + e.r; if (dx * dx + dy * dy < rr * rr) cb(e); });
}
function nearestEnemies(n, maxD = 650) {
  const arr = [];
  const md2 = maxD * maxD;
  const enemies = S.enemies;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    const dx = e.x - P.x, dy = e.y - P.y;
    if (Math.abs(dx) > maxD || Math.abs(dy) > maxD) continue;
    const d2 = dx * dx + dy * dy;
    if (d2 < md2) arr.push([d2, e]);
  }
  arr.sort((a, b) => a[0] - b[0]);
  return arr.slice(0, n).map(a => a[1]);
}

/* ---------------- エフェクト ---------------- */
function addText(x, y, txt, col = '#fff', size = 14) {
  if (S.texts.length > 90) S.texts.shift();
  S.texts.push({ x: x + rand(-6, 6), y, txt, col, size, life: 0.7 });
}
function burst(x, y, col, n = 8, sp = 140) {
  for (let i = 0; i < n; i++) {
    if (S.parts.length > 400) S.parts.shift();
    const a = Math.random() * TAU, v = rand(sp * .3, sp);
    S.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.3, .6), max: .6, col, r: rand(1.5, 3.5) });
  }
}

/* ---------------- ダメージ処理 ---------------- */
function hurtEnemy(e, dmg, kx = 0, ky = 0) {
  if (e.dead) return;
  dmg *= P.might * rand(0.9, 1.1);
  const crit = Math.random() < 0.08;
  if (crit) dmg *= 2;
  e.hp -= dmg; e.flash = 0.09;
  if (!e.boss) { e.kx += kx; e.ky += ky; }
  addText(e.x, e.y - e.r, Math.round(dmg), crit ? '#ffdd33' : '#fff', crit ? 19 : 14);
  sfx('hit');
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  e.dead = true; S.kills++;
  burst(e.x, e.y, e.boss ? '#ffb347' : '#b6ff9a', e.boss ? 40 : 7, e.boss ? 300 : 140);
  sfx(e.boss ? 'boom' : 'kill');
  if (e.type === 'fboss') { S.shake = 25; setTimeout(() => endGame(true), 1200); return; }
  if (e.boss) {
    S.shake = 16;
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * TAU, sp = rand(80, 220);
      dropGem(e.x, e.y, Math.ceil(e.xp / 20), Math.cos(a) * sp, Math.sin(a) * sp);
    }
    S.pickups.push({ x: e.x, y: e.y, kind: 'meat' });
    S.pickups.push({ x: e.x + 30, y: e.y, kind: 'magnet' });
    return;
  }
  // 敵撃破時にジェムが自機方向へ勢いよく弾む（目に見える初速ポップ＆回収動線）
  const toP = Math.atan2(P.y - e.y, P.x - e.x) + rand(-0.35, 0.35);
  const sp = rand(260, 380);
  dropGem(e.x, e.y, e.xp, Math.cos(toP) * sp, Math.sin(toP) * sp);
  const r = Math.random();
  if (r < 0.0088) S.pickups.push({ x: e.x, y: e.y, kind: 'meat' });
  else if (r < 0.0108) S.pickups.push({ x: e.x, y: e.y, kind: 'magnet' });
}
function dropGem(x, y, v, vx = 0, vy = 0) {
  if (S.gems.length > 500) {
    const g = S.gems[Math.floor(Math.random() * S.gems.length)]; g.v += v; return;
  }
  S.gems.push({ x, y, v, vx, vy, mag: false, sp: 0 });
}
function damagePlayer(d) {
  if (P.hurt > 0 || S.state !== 'play') return;
  d = Math.max(1, d - P.armor);
  P.hp -= d; P.hurt = 0.45; S.shake = Math.max(S.shake, 6);
  addText(P.x, P.y - 40, '-' + Math.round(d), '#ff5566', 18);
  sfx('hurt');
  if (P.hp <= 0) { P.hp = 0; endGame(false); }
}

/* ---------------- 武器の更新 ---------------- */
function updateWeapons(dt) {
  for (const w of S.weapons) {
    const st = WEAPONS[w.id].stats(w.lv);
    w.t -= dt;
    switch (w.id) {
      case 'fireball':
        if (w.t <= 0) {
          w.t = st.cd * P.cd;
          const base = Math.atan2(P.fy, P.fx);
          for (let i = 0; i < st.n; i++) {
            const a = base + (i - (st.n - 1) / 2) * 0.2;
            S.projs.push({ kind: 'fire', x: P.x, y: P.y - 10, vx: Math.cos(a) * 485, vy: Math.sin(a) * 485, r: 10.5 * P.area, dmg: st.dmg, pierce: st.pierce, life: 1.4, hits: new Set() });
          }
          sfx('shoot');
        }
        break;
      case 'poop':
        if (w.t <= 0) {
          w.t = st.cd * P.cd;
          const bx = P.x - P.fx * 44, by = P.y - P.fy * 44;
          S.poops.push({
            x: bx, y: by, r: 22, blastR: st.area * P.area, dmg: st.dmg,
            life: st.dur, max: st.dur, arm: 0.35, seed: Math.random() * 10
          });
          burst(bx, by, '#a86b2d', 6, 70);
          sfx('poop');
        }
        break;
      case 'tail':
        if (w.t <= 0) {
          w.t = st.cd * P.cd;
          const r = st.area * P.area;
          enemiesInCircle(P.x, P.y, r, e => {
            const a = Math.atan2(e.y - P.y, e.x - P.x);
            hurtEnemy(e, st.dmg, Math.cos(a) * 320, Math.sin(a) * 320);
          });
          S.effects.push({ kind: 'slash', x: P.x, y: P.y, r, dir: P.face, life: 0.28, max: 0.28, follow: true });
          tone(220, 0.16, 'sawtooth', 0.06, -120);
          noise(0.12, 0.05);
        }
        break;
      case 'syringe':
        if (w.t <= 0) {
          w.t = st.cd * P.cd;
          const targets = nearestEnemies(st.n, 420);
          for (let i = 0; i < st.n; i++) {
            let tx, ty;
            if (targets[i]) { tx = targets[i].x; ty = targets[i].y; }
            else { const a = Math.random() * TAU, r = rand(80, 220); tx = P.x + Math.cos(a) * r; ty = P.y + Math.sin(a) * r; }
            const a = Math.atan2(ty - P.y, tx - P.x), dist = Math.hypot(tx - P.x, ty - P.y);
            const life = Math.max(0.25, dist / 380);
            S.projs.push({ kind: 'syringe', x: P.x, y: P.y, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, r: 7, dmg: st.dmg, pierce: 1, life, hits: new Set(), st, rot: a });
          }
          sfx('shoot');
        }
        break;
      case 'saw': {
        w.ang += st.spd * dt;
        const R = st.area * P.area, sr = 17 * P.area;
        w.pos = [];
        for (let i = 0; i < st.n; i++) {
          const a = w.ang + i * TAU / st.n;
          const sx = P.x + Math.cos(a) * R, sy = P.y + Math.sin(a) * R;
          w.pos.push([sx, sy, a]);
          enemiesInCircle(sx, sy, sr, e => {
            if (e.sawCd > 0) return;
            e.sawCd = 0.45;
            hurtEnemy(e, st.dmg, Math.cos(a) * 200, Math.sin(a) * 200);
            if (Math.random() < 0.3) burst(sx, sy, '#ffe9a0', 3, 120);
          });
        }
        break;
      }
      case 'laser':
        if (w.t <= 0) {
          w.t = st.cd * P.cd;
          const tg = nearestEnemies(1)[0];
          const base = tg ? Math.atan2(tg.y - P.y, tg.x - P.x) : Math.atan2(P.fy, P.fx);
          const angs = st.n === 4 ? [0, Math.PI / 2, Math.PI, Math.PI * 1.5] : st.n === 2 ? [0, Math.PI] : [0];
          const len = 900, hw = st.area * P.area / 2;
          for (const da of angs) {
            const a = base + da, cx = Math.cos(a), cy = Math.sin(a);
            for (const e of S.enemies) {
              if (e.dead) continue;
              const ex = e.x - P.x, ey = e.y - P.y;
              const proj = ex * cx + ey * cy;
              if (proj < 0 || proj > len) continue;
              const perp = Math.abs(ex * cy - ey * cx);
              if (perp < hw + e.r) hurtEnemy(e, st.dmg, cx * 120, cy * 120);
            }
            S.effects.push({ kind: 'beam', x: P.x, y: P.y, a, len, w: hw * 2, life: 0.16, max: 0.16 });
          }
          sfx('beam');
        }
        break;
      case 'aura': {
        const r = st.area * P.area;
        w.r = r;
        w.tick -= dt;
        enemiesInCircle(P.x, P.y, r, e => { e.slow = Math.min(e.slow, 0.55); });
        if (w.tick <= 0) {
          w.tick = 0.35 * P.cd;
          enemiesInCircle(P.x, P.y, r, e => hurtEnemy(e, st.dmg, 0, 0));
        }
        break;
      }
      case 'lightning':
        if (w.t <= 0) {
          w.t = st.cd * P.cd;
          const vis = [];
          const hW = W / 2 + 20, hH = H / 2 + 20;
          for (let j = 0; j < S.enemies.length; j++) {
            const e = S.enemies[j];
            if (!e.dead && Math.abs(e.x - P.x) < hW && Math.abs(e.y - P.y) < hH) vis.push(e);
          }
          for (let i = 0; i < st.n && vis.length; i++) {
            const idx = Math.floor(Math.random() * vis.length);
            const e = vis.splice(idx, 1)[0];
            const ar = (st.area || 65) * P.area;
            enemiesInCircle(e.x, e.y, ar, o => hurtEnemy(o, st.dmg, 0, 0));
            const pts = []; let y = e.y - 500, x = e.x;
            while (y < e.y) { pts.push([x, y]); y += rand(25, 50); x = e.x + rand(-22, 22); }
            pts.push([e.x, e.y]);
            S.effects.push({ kind: 'bolt', pts, x: e.x, y: e.y, r: ar, life: 0.3, max: 0.3 });
          }
          sfx('zap');
        }
        break;
    }
  }
}

/* ---------------- 敵の出現 ---------------- */
const BOSS_TIMES = [150, 300, 450];
function pickType(t) {
  const m = t / 60;
  const pool = [['slime', Math.max(1, 10 - m * 1.6)], ['bat', m >= 0.5 ? 6 : 0], ['ghost', m >= 1.8 ? 5 : 0],
    ['gear', m >= 3 ? 5 : 0], ['knight', m >= 4.5 ? 4 + m * 0.3 : 0], ['golem', m >= 6 ? 1.5 + (m - 6) : 0]];
  let tot = 0; for (const p of pool) tot += p[1];
  let r = Math.random() * tot;
  for (const p of pool) { if ((r -= p[1]) <= 0) return p[0]; }
  return 'slime';
}
function spawnEnemy(type, x, y, mult) {
  const d = ETYPES[type];
  if (x === undefined) {
    // 65%は波のようにまとまって押し寄せるクラスタ方向から、35%は全方位から散発的に湧く
    let a;
    if (Math.random() < 0.65) {
      a = S.clusterAng + rand(-0.7, 0.7);
    } else {
      a = Math.random() * TAU;
    }
    const R = Math.hypot(W, H) / 2 + 50;
    x = P.x + Math.cos(a) * R; y = P.y + Math.sin(a) * R;
  }
  // 敵HP曲線のマイルド化（後半の極端なHPインフレを抑制）
  const hs = mult !== undefined ? mult : (1 + S.t / 150 + Math.pow(S.t / 270, 1.32));
  const e = { type, x, y, r: d.r, hp: d.hp * hs, maxHp: d.hp * hs, speed: d.speed * rand(0.9, 1.1),
    dmg: d.dmg * (1 + S.t / 500), xp: d.xp, boss: !!d.boss, name: d.name,
    kx: 0, ky: 0, flash: 0, seed: Math.random() * 10, sawCd: 0, ai: 0, ai2: 0, dash: 0, slow: 1, dead: false };
  S.enemies.push(e); return e;
}
function updateSpawns(dt) {
  const t = S.t;
  // クラスタ湧き角度の定期更新（5〜9秒ごとに主攻勢の方角が変化）
  S.clusterT -= dt;
  if (S.clusterT <= 0) {
    S.clusterAng = Math.random() * TAU;
    S.clusterT = rand(5, 9);
  }
  if (!S.finalBoss) {
    const rate = 2.2 + t / 18 + Math.pow(t / 130, 2);
    const cap = Math.min(550, 120 + t * 1.1);
    S.spawnAcc += rate * dt;
    while (S.spawnAcc >= 1) { S.spawnAcc--; if (S.enemies.length < cap) spawnEnemy(pickType(t)); }
    // 包囲ウェーブ（全周リングだが、脱出用の約50度の隙間を空けてプレイヤースキルで抜けられるように）
    const wv = Math.floor(t / 75);
    if (wv > 0 && !S.bossFlags['w' + wv]) {
      S.bossFlags['w' + wv] = true;
      const type = t > 360 ? 'ghost' : 'bat', n = 22 + wv * 5, R = Math.hypot(W, H) / 2 + 30;
      const gap = Math.random() * TAU, gapW = 0.9;
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU;
        let diff = Math.abs(a - gap);
        if (diff > Math.PI) diff = TAU - diff;
        if (diff < gapW / 2) continue; // 脱出スリット
        spawnEnemy(type, P.x + Math.cos(a) * R, P.y + Math.sin(a) * R);
      }
      S.banner = { txt: '敵の大群が迫る！', col: '#ff8a5c', life: 2 };
    }
  } else {
    S.spawnAcc += 2.5 * dt;
    while (S.spawnAcc >= 1) { S.spawnAcc--; if (S.enemies.length < 150) spawnEnemy(pickType(S.t)); }
  }
  BOSS_TIMES.forEach((bt, i) => {
    if (t >= bt && !S.bossFlags['b' + i]) {
      S.bossFlags['b' + i] = true;
      const names = ['スチームゴーレム', 'マッドサイボーグ', '暗黒ドラゴンマシン'];
      const b = spawnEnemy('boss', undefined, undefined, 1 + i * 1.6);
      b.name = names[i]; b.r = 54 + i * 6;
      S.banner = { txt: `⚠ BOSS ${names[i]} 出現！`, col: '#ff4d4d', life: 3 };
      sfx('warning');
    }
  });
  if (t >= 600 && !S.finalBoss) {
    S.finalBoss = spawnEnemy('fboss', undefined, undefined, 1);
    S.banner = { txt: '⚠ 最終ボス 機皇帝メカイザー 降臨！', col: '#ff3bd6', life: 4 };
    sfx('warning');
  }
}

/* ---------------- 更新 ---------------- */
function update(dt) {
  S.t += dt;
  // 移動
  let mx = 0, my = 0;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (keys.KeyW || keys.ArrowUp) my -= 1;
  if (keys.KeyS || keys.ArrowDown) my += 1;
  if (joy.active) {
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy);
    if (d > 8) { mx = dx / Math.max(d, 50); my = dy / Math.max(d, 50); }
  }
  const ml = Math.hypot(mx, my);
  P.moving = ml > 0.05;
  if (P.speedBoost > 0) P.speedBoost -= dt;
  if (P.superAura > 0) P.superAura -= dt;
  const curSpd = P.speed * (P.speedBoost > 0 ? 1.3 : 1.0);
  if (P.moving) {
    if (ml > 1) { mx /= ml; my /= ml; }
    P.x += mx * curSpd * dt; P.y += my * curSpd * dt;
    const n = Math.hypot(mx, my); P.fx = mx / n; P.fy = my / n;
    if (Math.abs(mx) > 0.1) P.face = mx > 0 ? 1 : -1;
    P.anim += dt;
    if (P.speedBoost > 0 && Math.random() < 0.35) {
      S.parts.push({ x: P.x + rand(-8, 8), y: P.y + 10, vx: -mx * 60, vy: -my * 60, life: 0.25, max: 0.25, col: '#ffe659', r: 2.5 });
    }
  }
  P.hurt -= dt;
  if (P.regen > 0) P.hp = Math.min(P.maxHp, P.hp + P.regen * dt);

  updateSpawns(dt);
  buildGrid();
  updateWeapons(dt);

  // 敵
  const far = Math.hypot(W, H) * 0.85;
  for (const e of S.enemies) {
    if (e.dead) continue;
    const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
    let sp = e.speed * e.slow; e.slow = 1;
    if (e.boss) {
      e.ai += dt; e.ai2 += dt;
      if (e.dash > 0) { e.dash -= dt; sp *= 3.2; }
      else if (e.ai > 4.5) { e.ai = 0; e.dash = 0.6; }
      const fin = e.type === 'fboss';
      if (e.ai2 > (fin ? 2.2 : 3.6)) {
        e.ai2 = 0;
        const n = fin ? 18 : 10, off = Math.random() * TAU;
        for (let i = 0; i < n; i++) {
          const a = off + i / n * TAU;
          S.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, r: 8, dmg: e.dmg * 0.6, life: 6, col: fin ? '#ff5ae0' : '#ff7a2a' });
        }
        if (fin && Math.random() < 0.5) for (let i = 0; i < 6; i++) spawnEnemy('knight', e.x + rand(-80, 80), e.y + rand(-80, 80));
      }
    }
    e.x += (dx / d * sp + e.kx) * dt; e.y += (dy / d * sp + e.ky) * dt;
    const damp = Math.min(1, dt * 9); e.kx -= e.kx * damp; e.ky -= e.ky * damp;
    e.flash -= dt; e.sawCd -= dt;
    if (!e.boss && d > far) { // 遠すぎる敵は進行方向前方に再配置
      const a = Math.atan2(P.fy, P.fx) + rand(-1, 1), R = Math.hypot(W, H) / 2 + 40;
      e.x = P.x + Math.cos(a) * R; e.y = P.y + Math.sin(a) * R;
    }
    if (d < e.r + P.r) damagePlayer(e.dmg);
  }
  // 敵同士の押し合い（直接セル参照＆偶奇分散で超高速化）
  sepTick = 1 - sepTick;
  const enemies = S.enemies;
  for (let i = sepTick; i < enemies.length; i += 2) {
    const e = enemies[i];
    if (e.dead || e.boss) continue;
    const cx = Math.floor(e.x / CELL), cy = Math.floor(e.y / CELL);
    for (let ox = -1; ox <= 1; ox++) {
      for (let oy = -1; oy <= 1; oy++) {
        const cell = grid.get(gkey(cx + ox, cy + oy));
        if (!cell) continue;
        for (let j = 0; j < cell.length; j++) {
          const o = cell[j];
          if (o === e || o.dead) continue;
          const dx = e.x - o.x, dy = e.y - o.y;
          const rr = (e.r + o.r) * 0.9;
          if (Math.abs(dx) > rr || Math.abs(dy) > rr) continue;
          const d2 = dx * dx + dy * dy;
          if (d2 < rr * rr && d2 > 0.01) {
            const d = Math.sqrt(d2), p = (rr - d) * 0.45;
            e.x += (dx / d) * p; e.y += (dy / d) * p;
          }
        }
      }
    }
  }

  // 弾
  for (const p of S.projs) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.kind === 'syringe') p.rot += dt * 12;
    if (p.life <= 0) { if (p.kind === 'syringe') makePuddle(p); p.dead = true; continue; }
    query(p.x, p.y, p.r, e => {
      if (p.dead || p.hits.has(e)) return;
      const dx = e.x - p.x, dy = e.y - p.y, rr = e.r + p.r;
      if (dx * dx + dy * dy < rr * rr) {
        p.hits.add(e);
        const n = Math.hypot(p.vx, p.vy) || 1;
        const kb = p.kind === 'fire' ? 340 : 160;
        hurtEnemy(e, p.kind === 'syringe' ? p.dmg * 1.3 : p.dmg, p.vx / n * kb, p.vy / n * kb);
        if (p.kind === 'fire') {
          burst(p.x, p.y, '#ff9a3c', 6, 130);
          if (p.blast) {
            enemiesInCircle(p.x, p.y, p.blast, o => {
              if (o !== e && !o.dead) hurtEnemy(o, p.dmg * 0.65, (o.x - p.x) * 2.5, (o.y - p.y) * 2.5);
            });
            S.effects.push({ kind: 'ring', x: p.x, y: p.y, r: p.blast, col: '255,140,40', life: 0.18, max: 0.18 });
          }
        }
        if (--p.pierce <= 0) { if (p.kind === 'syringe') makePuddle(p); p.dead = true; }
      }
    });
  }
  S.projs = S.projs.filter(p => !p.dead);

  // 毒沼
  for (const pd of S.puddles) {
    pd.life -= dt; pd.tick -= dt;
    if (pd.tick <= 0) { pd.tick = 0.3; enemiesInCircle(pd.x, pd.y, pd.r, e => hurtEnemy(e, pd.dmg * 0.3, 0, 0)); }
  }
  S.puddles = S.puddles.filter(p => p.life > 0);

  // うんち爆風による安全なノックバック方向（自分側へ敵を飛ばす事故を完全防止）
  function poopBlastDir(e, m) {
    let bx = e.x - m.x, by = e.y - m.y;
    let bd = Math.hypot(bx, by) || 1;
    bx /= bd; by /= bd;
    let px = e.x - P.x, py = e.y - P.y;
    let pd = Math.hypot(px, py) || 1;
    px /= pd; py /= pd;
    // うんちからの爆風がプレイヤーに近づける向き（内積が小さい/負）なら
    // プレイヤーから遠ざかる方向＋横拡散ベクトルへ安全にリダイレクト
    const dot = bx * px + by * py;
    if (dot < 0.35) {
      const perpX = bx - px * dot, perpY = by - py * dot;
      let ox = px * 0.85 + perpX * 0.55;
      let oy = py * 0.85 + perpY * 0.55;
      const od = Math.hypot(ox, oy) || 1;
      return [ox / od, oy / od];
    }
    return [bx, by];
  }

  // お漏らしボム（踏めば高威力集中爆破＆無敵、時間経過でも超広範囲自動爆発）
  for (const m of S.poops) {
    m.life -= dt;
    if (m.arm > 0) m.arm -= dt;
    const isStep = (m.arm <= 0) && ((P.x - m.x) ** 2 + (P.y - m.y) ** 2 < (P.r + m.r + 6) ** 2);
    const isTimeout = m.life <= 0;

    if (isStep) {
      // 1) 自分で踏んだ時：集中爆破＋無敵＋ノックバック
      m.life = 0;
      m.exploded = true;
      P.hurt = Math.max(P.hurt, 0.45); // 起爆時に短い無敵で包囲突破
      P.superAura = 0.45; // 黄金無敵オーラ発動
      S.shake = Math.max(S.shake, 12);
      enemiesInCircle(m.x, m.y, m.blastR, e => {
        const [dirX, dirY] = poopBlastDir(e, m);
        const dmg = e.boss ? m.dmg * 0.55 : m.dmg;
        hurtEnemy(e, dmg, dirX * 580, dirY * 580);
      });
      // 爆風内の敵弾もかき消す
      for (const b of S.ebullets) {
        if ((b.x - m.x) ** 2 + (b.y - m.y) ** 2 < m.blastR ** 2) b.life = 0;
      }
      S.effects.push({ kind: 'ring', x: m.x, y: m.y, r: m.blastR, col: '255,200,70', life: 0.38, max: 0.38 });
      S.effects.push({ kind: 'ring', x: m.x, y: m.y, r: m.blastR * 0.68, col: '185,120,45', life: 0.28, max: 0.28 });
      burst(m.x, m.y, '#ffd24d', 20, 260);
      burst(m.x, m.y, '#a86b2d', 16, 190);
      addText(m.x, m.y - 26, '💩BOOM!!', '#ffe066', 21);
      sfx('poopBoom');
    } else if (isTimeout && !m.exploded) {
      // 2) 時間経過で時限発動：威力40%で広範囲に牽制
      m.exploded = true;
      const timedR = m.blastR * 1.35; // 範囲1.35倍
      const timedDmg = m.dmg * 0.4;   // 威力40%（指定倍率）
      S.shake = Math.max(S.shake, 8);
      enemiesInCircle(m.x, m.y, timedR, e => {
        const [dirX, dirY] = poopBlastDir(e, m);
        const dmg = e.boss ? timedDmg * 0.5 : timedDmg;
        hurtEnemy(e, dmg, dirX * 400, dirY * 400);
      });
      // 広範囲の敵弾を一掃
      for (const b of S.ebullets) {
        if ((b.x - m.x) ** 2 + (b.y - m.y) ** 2 < timedR ** 2) b.life = 0;
      }
      S.effects.push({ kind: 'ring', x: m.x, y: m.y, r: timedR, col: '255,225,120', life: 0.42, max: 0.42 });
      S.effects.push({ kind: 'ring', x: m.x, y: m.y, r: timedR * 0.6, col: '190,140,60', life: 0.3, max: 0.3 });
      burst(m.x, m.y, '#ffe27a', 16, 220);
      burst(m.x, m.y, '#b07534', 12, 160);
      addText(m.x, m.y - 26, '💩BURST!', '#ffd866', 17);
      sfx('poopBoom');
    }
  }
  S.poops = S.poops.filter(m => m.life > 0);

  // 敵弾
  for (const b of S.ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if ((b.x - P.x) ** 2 + (b.y - P.y) ** 2 < (b.r + P.r * 0.8) ** 2) { damagePlayer(b.dmg); b.life = 0; }
  }
  S.ebullets = S.ebullets.filter(b => b.life > 0);

  // 経験値ジェム
  const mag2 = P.magnet * P.magnet;
  for (const g of S.gems) {
    const dx = P.x - g.x, dy = P.y - g.y, d2 = dx * dx + dy * dy;
    if (!g.mag) {
      if (g.vx || g.vy) {
        g.x += g.vx * dt; g.y += g.vy * dt;
        const decay = Math.max(0, 1 - dt * 5.0);
        g.vx *= decay; g.vy *= decay;
        if (g.vx * g.vx + g.vy * g.vy < 25) { g.vx = 0; g.vy = 0; }
      }
      if (d2 < mag2) g.mag = true;
    }
    if (g.mag) {
      g.sp = Math.min(900, g.sp + 1400 * dt);
      const d = Math.sqrt(d2) || 1;
      g.x += dx / d * g.sp * dt; g.y += dy / d * g.sp * dt;
      if (d < P.r + 6) { g.dead = true; gainXp(g.v); sfx('gem'); }
    }
  }
  S.gems = S.gems.filter(g => !g.dead);

  // アイテム
  for (const it of S.pickups) {
    if ((it.x - P.x) ** 2 + (it.y - P.y) ** 2 < (P.r + 16) ** 2) {
      it.dead = true;
      if (it.kind === 'meat') {
        if (P.hp >= P.maxHp) {
          // HP満タン時：経験値ボーナス ＋ 4秒間スピードアップ
          gainXp(Math.max(25, Math.floor(S.xpNext * 0.12)));
          P.speedBoost = 4.0;
          addText(P.x, P.y - 50, 'SPEED UP! +XP', '#ffd84a', 18);
          sfx('levelup');
          burst(P.x, P.y, '#ffd84a', 14, 180);
        } else {
          const h = 30 + P.maxHp * 0.1;
          P.hp = Math.min(P.maxHp, P.hp + h);
          addText(P.x, P.y - 50, '+' + Math.round(h), '#5dff8a', 20);
          sfx('heal');
        }
      }
      else { S.gems.forEach(g => g.mag = true); sfx('heal'); }
    }
  }
  S.pickups = S.pickups.filter(i => !i.dead);

  S.enemies = S.enemies.filter(e => !e.dead);
  if (S.finalBoss && S.finalBoss.dead) S.finalBoss.hp = 0;

  // パーティクル・テキスト・エフェクト
  for (const p of S.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const t of S.texts) { t.y -= 40 * dt; t.life -= dt; }
  S.texts = S.texts.filter(t => t.life > 0);
  for (const f of S.effects) f.life -= dt;
  S.effects = S.effects.filter(f => f.life > 0);
  if (S.banner) { S.banner.life -= dt; if (S.banner.life <= 0) S.banner = null; }
  S.shake = Math.max(0, S.shake - dt * 30);

  if (S.pendingLevels > 0 && S.state === 'play') processLevelQueue();
}
function makePuddle(p) {
  const st = p.st;
  S.puddles.push({ x: p.x, y: p.y, r: st.area * P.area, dmg: st.dmg, life: st.dur, max: st.dur, tick: 0, seed: Math.random() * 10 });
}
function gainXp(v) {
  S.xp += v;
  while (S.xp >= S.xpNext) { S.xp -= S.xpNext; S.level++; S.xpNext = xpFor(S.level); S.pendingLevels++; }
}

/* ---------------- レベルアップ & 進化 ---------------- */
function processLevelQueue() {
  if (S.stage < FORMS.length - 1 && S.level >= FORMS[S.stage + 1].lv) { startEvolution(); return; }
  if (S.pendingLevels > 0) openLevelUp();
}
function buildChoices() {
  const opts = [];
  for (const w of S.weapons) if (!WEAPONS[w.id].evoOnly && w.lv < WEAPONS[w.id].max) opts.push({ type: 'w', id: w.id, wt: 3 });
  if (S.weapons.length < 6) for (const id in WEAPONS) if (!WEAPONS[id].evoOnly && WEAPONS[id].stage <= S.stage && !hasWeapon(id)) opts.push({ type: 'w', id, wt: 4 + (WEAPONS[id].stage === S.stage ? 2 : 0) });
  const pc = Object.keys(S.passives).length;
  for (const id in PASSIVES) { const lv = pl(id); if (lv >= PASSIVES[id].max) continue; if (!lv && pc >= 6) continue; opts.push({ type: 'p', id, wt: 2 }); }
  const n = S.stage >= 3 ? 4 : 3;
  const res = [];
  while (res.length < n && opts.length) {
    let tot = opts.reduce((s, o) => s + o.wt, 0), r = Math.random() * tot, i = 0;
    for (; i < opts.length; i++) if ((r -= opts[i].wt) <= 0) break;
    res.push(opts.splice(Math.min(i, opts.length - 1), 1)[0]);
  }
  if (!res.length) res.push({ type: 'heal' }, { type: 'xpboost' });
  return res;
}
function statDiff(id, lv) {
  const a = WEAPONS[id].stats(lv), b = WEAPONS[id].stats(lv + 1);
  const out = [];
  for (const k in b) if (Math.abs(a[k] - b[k]) > 1e-6) {
    const f = v => (Math.round(v * 100) / 100);
    out.push(`${STAT_LABEL[k]} ${f(a[k])}→${f(b[k])}`);
  }
  return out.join(' / ');
}
function openLevelUp(alreadyOpen = false) {
  S.state = 'levelup';
  S.shake = 0;
  S.choices = buildChoices();
  sfx('levelup');
  const box = $('cards'); box.innerHTML = '';
  S.choices.forEach((c, i) => {
    let ic, nm, tag, ds;
    if (c.type === 'w') {
      const W_ = WEAPONS[c.id], cur = hasWeapon(c.id);
      ic = W_.icon; nm = W_.name;
      if (cur) { tag = `<span class="tag">Lv${cur.lv}→${cur.lv + 1}</span>`; ds = statDiff(c.id, cur.lv); }
      else { tag = '<span class="tag new">NEW!</span>'; ds = W_.desc; }
    } else if (c.type === 'p') {
      const P_ = PASSIVES[c.id], lv = pl(c.id);
      ic = P_.icon; nm = P_.name; tag = `<span class="tag pas">${lv ? `Lv${lv}→${lv + 1}` : 'NEW!'}</span>`; ds = P_.desc;
    } else if (c.type === 'heal') { ic = '🍖'; nm = '骨付き肉'; tag = ''; ds = 'HPを50回復'; }
    else { ic = '💎'; nm = '経験の結晶'; tag = ''; ds = '経験値を獲得'; }
    const b = document.createElement('button');
    b.className = 'card';
    b.innerHTML = `<div class="ic">${ic}</div><div class="tx"><div class="nm">${nm}${tag}</div><div class="ds">${ds}</div></div><div class="key">[${i + 1}]</div>`;
    b.onclick = () => chooseCard(i);
    box.appendChild(b);
  });
  if (!alreadyOpen) $('levelup').classList.remove('hidden');
}
function chooseCard(i) {
  if (S.state !== 'levelup') return;
  const c = S.choices[i]; if (!c) return;
  sfx('select');
  if (c.type === 'w') addWeapon(c.id);
  else if (c.type === 'p') { S.passives[c.id] = pl(c.id) + 1; recalcStats(); }
  else if (c.type === 'heal') P.hp = Math.min(P.maxHp, P.hp + 50);
  else S.xp += S.xpNext * 0.3;
  S.pendingLevels--;
  if (S.pendingLevels > 0) {
    if (S.stage < FORMS.length - 1 && S.level >= FORMS[S.stage + 1].lv) {
      $('levelup').classList.add('hidden');
      startEvolution();
      return;
    }
    openLevelUp(true);
    return;
  }
  $('levelup').classList.add('hidden');
  last = performance.now();
  if (AC.ctx && BGM.next < AC.ctx.currentTime) BGM.next = AC.ctx.currentTime + 0.05;
  S.state = 'play';
}
function startEvolution() {
  S.state = 'evolve';
  S.shake = 0;
  S.evo = { t: 0, from: S.stage, to: S.stage + 1, flashT: 0, sounded: false };
}
function finishEvolution() {
  if (S.state !== 'evolve') return;
  const to = S.evo.to;
  S.stage = to;
  recalcStats();
  P.hp = P.maxHp;
  const w = addWeapon(FORMS[to].weapon);
  if (w.lv === 1 && FORMS[to].weapon) { /* 新武器獲得 */ }
  // 進化ボーナス：毒液シリンジのLvが2上がる
  const syr = hasWeapon('syringe');
  if (syr) syr.lv = Math.min(WEAPONS.syringe.max, syr.lv + 2);
  // 進化の衝撃波
  P.hurt = 1.5;
  buildGrid();
  enemiesInCircle(P.x, P.y, 320, e => {
    const a = Math.atan2(e.y - P.y, e.x - P.x);
    hurtEnemy(e, 60 + to * 40, Math.cos(a) * 700, Math.sin(a) * 700);
  });
  S.effects.push({ kind: 'ring', x: P.x, y: P.y, r: 320, col: '255,255,200', life: 0.6, max: 0.6 });
  S.banner = { txt: `${FORMS[to].name} に進化！`, col: FORMS[to].color, life: 2.5 };
  S.evo = null;
  last = performance.now();
  if (AC.ctx && BGM.next < AC.ctx.currentTime) BGM.next = AC.ctx.currentTime + 0.05;
  S.state = 'play';
  if (S.pendingLevels > 0) processLevelQueue();
}

/* ---------------- 描画 ---------------- */
function render() {
  ctx.clearRect(0, 0, W, H);
  if (!S) { drawBg(performance.now() / 30, performance.now() / 50); return; }
  const cam = S.cam;
  const shake = S.state === 'play' ? S.shake : 0;
  cam.x = P.x - W / 2 + (shake ? rand(-shake, shake) : 0);
  cam.y = P.y - H / 2 + (shake ? rand(-shake, shake) : 0);
  drawBg(cam.x, cam.y);
  ctx.save();
  ctx.translate(-cam.x, -cam.y);
  const inView = (x, y, m = 80) => x > cam.x - m && x < cam.x + W + m && y > cam.y - m && y < cam.y + H + m;

  // 毒沼
  for (const pd of S.puddles) {
    const a = Math.min(1, pd.life / 0.5) * 0.55;
    const grd = ctx.createRadialGradient(pd.x, pd.y, 0, pd.x, pd.y, pd.r);
    grd.addColorStop(0, `rgba(170,255,60,${a})`); grd.addColorStop(0.7, `rgba(90,200,30,${a * 0.8})`); grd.addColorStop(1, 'rgba(60,140,20,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(pd.x, pd.y, pd.r, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(220,255,150,${a})`;
    for (let i = 0; i < 3; i++) { const bb = (S.t * 1.5 + i * 0.33 + pd.seed) % 1; ctx.beginPath(); ctx.arc(pd.x + Math.cos(i * 2.1 + pd.seed) * pd.r * 0.5, pd.y + Math.sin(i * 2.1 + pd.seed) * pd.r * 0.4, 2 + bb * 4, 0, TAU); ctx.fill(); }
  }
  // お漏らしボム（設置うんち）
  for (const m of S.poops) {
    const timedR = m.blastR * 1.35;
    if (!inView(m.x, m.y, timedR)) continue;
    const armed = m.arm <= 0;
    const blink = m.life < 2.0 ? (Math.sin(S.t * 22) > 0 ? 1 : 0.35) : 1;
    const pulse = 1 + Math.sin(S.t * 7 + m.seed) * 0.08;
    ctx.save();
    ctx.globalAlpha = blink;
    // 外側：時限爆発の超広範囲ガイド円
    ctx.strokeStyle = 'rgba(255,225,120,0.14)';
    ctx.lineWidth = 1.5; ctx.setLineDash([4, 10]);
    ctx.beginPath(); ctx.arc(m.x, m.y, timedR, 0, TAU); ctx.stroke();
    // 内側：直接踏んだ時の高威力爆発範囲ガイド円
    ctx.strokeStyle = armed ? 'rgba(255,215,80,0.32)' : 'rgba(200,200,200,0.15)';
    ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.arc(m.x, m.y, m.blastR, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    // 踏む判定サークル（光る台座）
    const grd = ctx.createRadialGradient(m.x, m.y, 2, m.x, m.y, m.r * 1.6 * pulse);
    grd.addColorStop(0, armed ? 'rgba(255,230,90,0.75)' : 'rgba(180,180,180,0.35)');
    grd.addColorStop(0.65, armed ? 'rgba(255,150,30,0.4)' : 'rgba(120,120,120,0.15)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 1.6 * pulse, 0, TAU); ctx.fill();
    // 残り時間ゲージリング
    ctx.strokeStyle = '#1a0f05'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.stroke();
    ctx.strokeStyle = armed ? '#ffdd44' : '#aaa'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, -Math.PI / 2, -Math.PI / 2 + TAU * (m.life / m.max)); ctx.stroke();
    // 本体アイコン
    ctx.font = '28px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('💩', m.x, m.y - 2 + Math.sin(S.t * 6 + m.seed) * 2);
    ctx.restore();
  }
  // オーラ
  const aura = hasWeapon('aura');
  if (aura && aura.r) {
    const r = aura.r, pulse = 1 + Math.sin(S.t * 4) * 0.03;
    const grd = ctx.createRadialGradient(P.x, P.y, r * 0.2, P.x, P.y, r * pulse);
    grd.addColorStop(0, 'rgba(255,255,220,0.05)'); grd.addColorStop(0.75, 'rgba(120,255,190,0.16)'); grd.addColorStop(1, 'rgba(255,240,150,0.35)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(P.x, P.y, r * pulse, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,240,170,0.5)'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]); ctx.lineDashOffset = -S.t * 40;
    ctx.beginPath(); ctx.arc(P.x, P.y, r * pulse, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  }
  // ジェム（事前キャッシュスプライトで超高速描画）
  const st7 = S.t * 7, st5 = S.t * 5;
  for (let i = 0; i < S.gems.length; i++) {
    const g = S.gems[i];
    if (!inView(g.x, g.y, 40)) continue;
    const tier = g.v >= 25 ? 3 : g.v >= 8 ? 2 : g.v >= 3 ? 1 : 0;
    const sp = GEM_SPRITES[tier];
    const pulse = 1 + Math.sin(st7 + g.x * 0.05) * 0.1;
    const bob = Math.sin(st5 + (g.x + g.y) * 0.03) * 2.4;
    const dw = sp.w * pulse, dh = sp.w * pulse;
    ctx.drawImage(sp.c, g.x - dw / 2, g.y + bob - dh / 2, dw, dh);
  }
  // アイテム（肉・磁石：光の柱＋二重発光リング＋バウンスで視認性大幅アップ）
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const it of S.pickups) {
    if (!inView(it.x, it.y, 100)) continue;
    const isMeat = it.kind === 'meat';
    const b = Math.sin(S.t * 5.5 + it.x) * 4;
    const pulse = 1 + Math.sin(S.t * 8 + it.y) * 0.14;
    const ix = it.x, iy = it.y + b;
    // 上方に伸びる光のビーコン柱
    const pillar = ctx.createLinearGradient(ix, iy - 58, ix, iy + 10);
    pillar.addColorStop(0, 'rgba(255,255,255,0)');
    pillar.addColorStop(0.7, isMeat ? 'rgba(110,255,150,0.38)' : 'rgba(100,220,255,0.38)');
    pillar.addColorStop(1, isMeat ? 'rgba(255,230,100,0.7)' : 'rgba(180,245,255,0.7)');
    ctx.fillStyle = pillar;
    ctx.fillRect(ix - 12, iy - 58, 24, 68);
    // 強い背面グロー
    const grd = ctx.createRadialGradient(ix, iy, 2, ix, iy, 34 * pulse);
    grd.addColorStop(0, '#ffffff');
    grd.addColorStop(0.45, isMeat ? 'rgba(100,255,140,0.85)' : 'rgba(90,220,255,0.85)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(ix, iy, 34 * pulse, 0, TAU); ctx.fill();
    // 黒縁＋白黄リング

    ctx.beginPath(); ctx.arc(ix, iy, 20 * pulse, 0, TAU); ctx.stroke();
    ctx.lineWidth = 2.5; ctx.strokeStyle = isMeat ? '#a8ff78' : '#78e8ff';
    ctx.beginPath(); ctx.arc(ix, iy, 20 * pulse, 0, TAU); ctx.stroke();
    // アイコン＋ラベル
    ctx.font = '30px serif';
    ctx.fillText(isMeat ? '🍖' : '🧲', ix, iy);
    ctx.font = '900 11px sans-serif';
    ctx.lineWidth = 3; ctx.strokeStyle = '#000';
    const lbl = isMeat ? 'HP回復' : '全回収';

    const k = t < 3.0 ? (t - 2.7) / 0.3 : 1 - (t - 3.0) / 0.5;
    ctx.fillStyle = `rgba(255,255,255,${k})`; ctx.fillRect(0, 0, W, H);
  }
}

/* ---------------- 画面遷移 ---------------- */
function show(id) { ['title', 'levelup', 'pause', 'result'].forEach(s => $(s).classList.toggle('hidden', s !== id)); }
function startGame() {
  audioInit(); bgmStart();
  last = performance.now();
  newGame(); show(null);
}
function renderInventoryHtml() {
  const wSlots = S.weapons.map(w => {
    const isMax = w.lv >= WEAPONS[w.id].max;
    const lvText = isMax ? 'MAX' : 'Lv' + w.lv;
    return `<div class="inv-slot weapon ${isMax ? 'max' : ''}" title="${WEAPONS[w.id].name} (${lvText})"><span class="icon">${WEAPONS[w.id].icon}</span><span class="lv">${lvText}</span></div>`;
  }).join('');
  const pSlots = Object.keys(S.passives).map(id => {
    const lv = S.passives[id];
    const isMax = lv >= PASSIVES[id].max;
    const lvText = isMax ? 'MAX' : 'Lv' + lv;
    return `<div class="inv-slot passive ${isMax ? 'max' : ''}" title="${PASSIVES[id].name} (${lvText})"><span class="icon">${PASSIVES[id].icon}</span><span class="lv">${lvText}</span></div>`;
  }).join('');
  return `
    <div class="inv-box">
      <div class="inv-title">取得装備</div>
      <div class="inv-row">${wSlots}</div>
      ${pSlots ? `<div class="inv-row">${pSlots}</div>` : ''}
    </div>`;
}
function pauseGame() {
  S.state = 'pause';
  S.shake = 0;
  $('pauseInfo').innerHTML = `<div>${FORMS[S.stage].name}（${FORMS[S.stage].title}） Lv${S.level}　⏱ ${fmtTime(S.t)}　💀 ${S.kills}</div>${renderInventoryHtml()}`;
  show('pause');
}
function resumeGame() {
  last = performance.now();
  if (AC.ctx && BGM.next < AC.ctx.currentTime) BGM.next = AC.ctx.currentTime + 0.05;
  S.state = 'play';
  show(null);
}
function endGame(clear) {
  if (S.state === 'over') return;
  S.state = 'over';
  S.shake = 0;
  sfx(clear ? 'clear' : 'over');
  setTimeout(() => {
    $('resultTitle').textContent = clear ? '🏆 GAME CLEAR!! 🏆' : 'GAME OVER';
    $('resultTitle').style.color = clear ? '#7dffc4' : '#ff6b6b';
    $('resultImg').src = formSrc(S.stage);
    $('resultImg').onerror = function () { this.onerror = null; this.src = `img/raw${S.stage + 1}.jpg`; };
    $('resultInfo').innerHTML =
      `${clear ? '機皇帝メカイザーを打ち倒した！<br>' : ''}到達フォーム：<b style="color:${FORMS[S.stage].color}">${FORMS[S.stage].name}</b>（${FORMS[S.stage].title}）<br>` +
      `生存時間：<b>${fmtTime(S.t)}</b>　レベル：<b>${S.level}</b>　撃破数：<b>${S.kills}</b><br>` +
      renderInventoryHtml();
    show('result');
  }, clear ? 300 : 900);
}
$('startBtn').onclick = startGame;
$('retryBtn').onclick = startGame;
$('resumeBtn').onclick = resumeGame;
$('quitBtn').onclick = () => { S = null; show('title'); };
$('toTitleBtn').onclick = () => { S = null; show('title'); };

// タイトルの進化ライン
(() => {
  const el = $('evoLine');

    if (i) { const a = document.createElement('div'); a.className = 'evo-arrow'; a.textContent = '▶'; el.appendChild(a); }

    el.appendChild(d);
  });
})();

/* ---------------- メインループ ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (S) {
    if (S.state === 'play') update(dt);
    else if (S.state === 'evolve') S.evo.t += dt;
  }
  render();
  requestAnimationFrame(frame);
}

});
